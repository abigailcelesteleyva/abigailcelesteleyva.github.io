<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" fill="none">
  <!-- Legs -->
  <line x1="28" y1="88" x2="22" y2="108" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="88" x2="58" y2="108" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="19" cy="108" rx="7" ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="61" cy="108" rx="7" ry="3.5" fill="#1a1a1a"/>
  <!-- Body -->
  <ellipse cx="40" cy="78" rx="18" ry="14" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Left arm (waving up) -->
  <path d="M22 70 Q8 52 14 38" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Right arm (down) -->
  <path d="M58 72 Q70 78 68 88" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Hand/glove (waving) -->
  <path d="M14 38 Q10 22 16 16 Q20 10 26 14 Q26 8 30 6 Q36 4 36 12 Q40 4 44 6 Q48 8 46 14 Q50 8 54 12 Q56 18 52 22 Q52 30 46 36 Q40 40 30 40 Q20 40 14 38Z" fill="white" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Finger lines on glove -->
  <line x1="26" y1="14" x2="28" y2="30" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="12" x2="36" y2="30" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="14" x2="44" y2="30" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyes on body -->
  <circle cx="34" cy="76" r="3" fill="#1a1a1a"/>
  <circle cx="46" cy="76" r="3" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="35.2" cy="74.8" r="1" fill="white"/>
  <circle cx="47.2" cy="74.8" r="1" fill="white"/>
  <!-- Smile -->
  <path d="M33 83 Q40 88 47 83" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
